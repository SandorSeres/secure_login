services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [secure_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB} -h 127.0.0.1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks: [secure_net]
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: "production"
      SECRET_KEY: ${SECRET_KEY}
      CSRF_KEY: ${CSRF_KEY}
      DATABASE_URL: postgresql+psycopg2://${PG_USER}:${PG_PASSWORD}@db:5432/${PG_DB}
      REDIS_URL: redis://redis:6379/0
      SESSION_COOKIE_NAME: session
      CSRF_COOKIE_NAME: csrf_token
      APP_HOST: ${APP_HOST}
      
      SMTP_HOST: "smtp.integrity.hu"
      SMTP_PORT: "587"                      # ha 465-öt használsz, akkor SSL=True
      SMTP_STARTTLS: "true"
      SMTP_SSL: "false"
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [secure_net]
    restart: unless-stopped

#  mailhog:
#    image: mailhog/mailhog
#    ports:
#      - "8025:8025"   # web UI itt: http://localhost:8025
#    networks: [secure_net]
      
  caddy:
    image: caddy:2-alpine
    depends_on:
      api:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:?Set CADDY_DOMAIN to your public DNS hostname}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL to an ACME contact address}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/app-gateway-generated:/etc/caddy/app-gateway-generated:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - secure_net
      - research_gateway
    restart: unless-stopped

networks:
  secure_net:
  research_gateway:
    external: true
    name: evidence-research_gateway

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:

