name: User-application N-to-M schema tests

on:
  pull_request:
    paths:
      - 'api/app/models.py'
      - 'api/app/config.py'
      - 'tests/test_user_application_access.py'
      - '.github/workflows/user-application-schema.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        run: python -m pip install "sqlalchemy==2.0.36" "pydantic==2.9.2" "pydantic-settings==2.5.2"
      - name: Syntax and import check
        run: python -m compileall -q api/app/models.py tests/test_user_application_access.py
      - name: Run N:M schema regression tests
        env:
          PYTHONPATH: api
          SECRET_KEY: ci-only-not-a-production-secret
          CSRF_KEY: ci-only-not-a-production-csrf-key
          DATABASE_URL: 'sqlite://'
        run: python -m unittest discover -s tests -p 'test_user_application_access.py' -v
