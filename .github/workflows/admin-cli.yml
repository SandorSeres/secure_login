name: Secure Login admin CLI integration

on:
  pull_request:
    paths:
      - 'admin.sh'
      - 'scripts/render_app_gateway.py'
      - 'api/app/models.py'
      - '.github/workflows/admin-cli.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-cli:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: secure-login-admin-ci
      PG_USER: adminci
      PG_PASSWORD: test-only-database-password
      PG_DB: adminci
      SECRET_KEY: ci-only-signing-secret
      CSRF_KEY: ci-only-csrf-secret
      CADDY_DOMAIN: auth.example.com
      ACME_EMAIL: ci@example.com
      APP_HOST: https://auth.example.com
      SMTP_USER: ci
      SMTP_PASSWORD: ci
      SMTP_FROM: ci@example.com
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax check
        run: bash -n admin.sh
      - name: Compose config check
        run: docker compose config --quiet
      - name: Start isolated PostgreSQL only
        run: docker compose up -d --wait db
      - name: Integration regression tests
        shell: bash
        run: |
          set -Eeuo pipefail

          # CI-only disposable DB; create the exact production schema.
          docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1' <<'SQL'
          CREATE TABLE users (
            id integer GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
            username varchar(128) NOT NULL UNIQUE,
            password_hash varchar(256) NOT NULL,
            email varchar(255) NOT NULL UNIQUE,
            created_at timestamp,
            account_level varchar(32),
            last_activity timestamp
          );
          CREATE TABLE applications (
            id varchar(63) PRIMARY KEY,
            name varchar(100) NOT NULL
          );
          CREATE TABLE user_application_access (
            user_id integer NOT NULL REFERENCES users(id) ON DELETE CASCADE,
            application_id varchar(63) NOT NULL REFERENCES applications(id) ON DELETE CASCADE,
            PRIMARY KEY (user_id, application_id)
          );
          CREATE INDEX ix_user_application_access_application_id ON user_application_access(application_id);
          INSERT INTO users(username, password_hash, email, created_at, last_activity, account_level)
          VALUES ('alice', 'test-hash', 'alice@example.invalid', NOW(), NOW(), 'Free'),
                 ('bob', 'test-hash', 'bob@example.invalid', NOW(), NOW(), 'Free');
          SQL

          cli() { bash admin.sh <<< "$1"; }
          query() {
            docker compose exec -T db sh -c 'psql -X -qAt -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1' <<< "$1"
          }

          cli $'1\n3\n0' > /tmp/list.out
          grep -q 'alice' /tmp/list.out

          # Names containing a quote must be safely parameterized.
          cli $'4\nresearch\nResearch team\x27s workspace\ny\nhttps://research.code.hu/apps/research\nhttp://research:8000\n\ny\n0' > /tmp/create.out
          [[ "$(query "SELECT name FROM applications WHERE id='research';")" == "Research team's workspace" ]]

          cli $'4\ndashboard\nDashboard\ny\nhttps://research.code.hu\nhttp://dashboard:8000\n\ny\n0' > /tmp/create2.out
          [[ "$(query "SELECT count(*) FROM applications;")" == 2 ]]
          [[ "$(query "SELECT count(*) FROM application_targets;")" == 2 ]]
          grep -q 'forward_auth' caddy/app-gateway-generated/research-gateway.caddy
          cli $'8\nresearch\nhttps://research.code.hu/apps/research\nhttp://research:8000\n\ny\n0' > /tmp/url-update.out
          [[ "$(query "SELECT public_url FROM application_targets WHERE application_id='research';")" == https://research.code.hu/apps/research ]]
          python3 -m py_compile scripts/render_app_gateway.py

          cli $'5\nalice\nresearch\ny\n0' > /tmp/grant.out
          cli $'5\nalice\ndashboard\ny\n0' > /tmp/grant2.out
          cli $'5\nbob\nresearch\ny\n0' > /tmp/grant3.out
          [[ "$(query "SELECT count(*) FROM user_application_access;")" == 3 ]]

          # Idempotence: no second grant, no duplicate rows.
          cli $'5\nalice\nresearch\n0' > /tmp/duplicate.out
          [[ "$(query "SELECT count(*) FROM user_application_access;")" == 3 ]]

          cli $'7\nalice\n0' > /tmp/user_apps.out
          grep -q 'research' /tmp/user_apps.out
          grep -q 'dashboard' /tmp/user_apps.out

          # Denied confirmation means no write.
          cli $'6\nalice\nresearch\nn\n0' > /tmp/no_revoke.out
          [[ "$(query "SELECT count(*) FROM user_application_access;")" == 3 ]]

          cli $'6\nalice\nresearch\ny\n0' > /tmp/revoke.out
          [[ "$(query "SELECT count(*) FROM user_application_access;")" == 2 ]]
          [[ "$(query "SELECT count(*) FROM user_application_access WHERE application_id='research' AND user_id=(SELECT id FROM users WHERE username='bob');")" == 1 ]]

          cli $'2\nalice\n2\ny\n0' > /tmp/level.out
          [[ "$(query "SELECT account_level FROM users WHERE username='alice';")" == Pro ]]
          [[ "$(query "SELECT account_level FROM users WHERE username='bob';")" == Free ]]

          # Inputs resembling SQL must never execute.
          cli $'4\ninvalid\x27;drop\n0' > /tmp/invalid.out 2>&1 && exit 1 || true
          [[ "$(query "SELECT count(*) FROM users;")" == 2 ]]

          echo "admin.sh PostgreSQL integration tests passed"
      - name: Ensure database cleanup
        if: always()
        run: docker compose down -v --remove-orphans
