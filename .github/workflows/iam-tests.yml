name: Secure Login IAM tests
on:
  push:
    branches: ["feature/multi-app-access-rem"]
  pull_request:
    branches: ["main"]
jobs:
  iam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install -r api/app/requirements.txt
          python -m pip install pytest httpx
      - name: Syntax
        run: python -m compileall -q api/app api/tests
      - name: IAM tests
        run: python -m pytest -q api/tests/test_application_access.py
      - name: Login regression tests
        working-directory: api
        run: python -m pytest -q tests/test_login_regressions.py tests/test_gateway_authorization.py
