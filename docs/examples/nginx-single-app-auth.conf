# REFERENCE ONLY — do not include in a live nginx.conf yet.
# This sample belongs inside the existing TLS server {} block.
# Prerequisites:
#  - DNS reachable from the nginx container for workspace-one
#  - verified Nginx -> app container isolation and private Docker network
#  - actual session cookie recognized by the Secure Login backend
#  - backend user authorization tested end-to-end against the production-like DB
#
# A fixed upstream is mandatory. Never build proxy_pass from user-controlled
# instance ID, Host or query parameters. Never expose a dynamic open proxy.
#
# The backend must enforce its own user-level RAG / input / job authorization
# even after gateway admission.

location = /_iam_check_workspace_one {
    internal;
    proxy_pass http://api_upstream/iam/gateway/authorize/workspace-one;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Authorization "";
    proxy_set_header X-User-ID "";
    proxy_set_header X-Forwarded-User "";
    proxy_set_header X-Remote-User "";
}

location /apps/workspace-one/ {
    auth_request /_iam_check_workspace_one;
    error_page 401 = @iam_login_required;
    # Application UI must support subpath hosting before enabling this.
    proxy_pass http://workspace-one:8201/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Prefix /apps/workspace-one;
    proxy_set_header X-User-ID "";
    proxy_set_header X-Forwarded-User "";
    proxy_set_header X-Remote-User "";
    # Do not leak the Secure Login session cookie to a separate application.
    # App-specific cookies require separate audited mapping/configuration.
    proxy_set_header Cookie "";
}

location @iam_login_required {
    return 401;
}
